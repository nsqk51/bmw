server.port=${PORT:8080}

# PostgreSQL (кафедральный сервер: хост pg, БД studs). Логин/пароль — через переменные окружения.
# currentSchema: схема для таблиц и функций. По умолчанию — личная схема (её имя совпадает с логином),
# переменной DB_SCHEMA можно выбрать другую, не затрагивая таблицы прежних работ.
spring.datasource.url=jdbc:postgresql://${DB_HOST:pg}:${DB_PORT:5432}/${DB_NAME:studs}?currentSchema=${DB_SCHEMA:${DB_USER:s000000}}
spring.datasource.username=${DB_USER:s000000}
spring.datasource.password=${DB_PASSWORD:changeme}

# Схема и функции БД создаются из schema.sql (ограничения и функции на уровне БД), Hibernate схему не меняет.
# В теле функций (PL/pgSQL) есть символ ';', поэтому разделитель команд в schema.sql нестандартный.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.separator=^^^ END OF STATEMENT
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
